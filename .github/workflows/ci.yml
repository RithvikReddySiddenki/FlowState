name: FlowState checks
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowstate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: flowstate_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowstate -d flowstate_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://flowstate:ci-only-password@localhost:5432/flowstate_ci
      SESSION_SECRET: synthetic-ci-secret-not-for-real-sessions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check apps/api tests scripts
      - run: ruff format --check apps/api tests scripts
      - run: python -m compileall -q apps/api
      - run: python -m unittest discover -v
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - name: PostgreSQL API integration suite (isolated synthetic schemas)
        run: python -m unittest discover -v
        env:
          FLOWSTATE_TEST_DATABASE_URL: postgresql+psycopg://flowstate:ci-only-password@localhost:5432/flowstate_ci
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  containers:
    runs-on: ubuntu-latest
    env:
      GRAFANA_ADMIN_PASSWORD: synthetic-ci-monitoring-password
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic container environment
        run: |
          cp .env.example apps/api/.env
          echo 'POSTGRES_PASSWORD=ci-only-password' > .env
      - run: docker compose -f compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker compose -f compose.yml -f docker-compose.prod.yml config --quiet
      - run: docker compose -f compose.yml -f docker-compose.prod.yml build
      - name: Check complete local development stack
        run: |
          docker compose -p flowstate-validation -f compose.yml -f docker-compose.dev.yml -f compose.validation.yml up --build -d --wait --wait-timeout 240
          curl --fail http://localhost:18000/health/ready
          curl --fail http://localhost:13000
          cat scripts/smoke_stack.py | docker compose -p flowstate-validation -f compose.yml -f docker-compose.dev.yml -f compose.validation.yml exec -T api python -
          docker compose -p flowstate-validation -f compose.yml -f docker-compose.dev.yml -f compose.validation.yml exec -d worker python -m tests.container_worker
          cat scripts/smoke_worker_success.py | docker compose -p flowstate-validation -f compose.yml -f docker-compose.dev.yml -f compose.validation.yml exec -T api python -
          cat scripts/smoke_recovery.py | docker compose -p flowstate-validation -f compose.yml -f docker-compose.dev.yml -f compose.validation.yml exec -T api python -
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Real stack browser workflows
        run: |
          mkdir -p .tools
          docker cp flowstate-validation-api-1:/tmp/flowstate-smoke-session.json .tools/validation-session.json
          cd apps/web
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.live.config.ts
      - name: Private monitoring runtime
        run: |
          docker compose -p flowstate-validation -f compose.yml -f docker-compose.dev.yml -f compose.validation.yml -f docker-compose.monitoring.yml --profile monitoring up --build -d --wait --wait-timeout 240
          python -m pip install httpx
          for attempt in {1..20}; do
            if python scripts/check_monitoring.py; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Local HTTPS template and certificate reload
        run: |
          python -m pip install cryptography==50.0.0
          python -m scripts.check_local_tls
      - name: Cleanup synthetic stack
        if: always()
        run: docker compose -p flowstate-validation -f compose.yml -f docker-compose.dev.yml -f compose.validation.yml -f docker-compose.monitoring.yml --profile monitoring down
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [infra/terraform, infra/terraform-managed]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - run: ansible-playbook -i inventory.example.yml site.yml --syntax-check
        working-directory: infra/ansible
      - run: ruby -c infra/vagrant/Vagrantfile
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.2"
      - run: packer init infra/packer
      - run: packer fmt -check infra/packer
      - run: packer validate infra/packer
        env:
          AWS_EC2_METADATA_DISABLED: "true"
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.33.0
      - run: bash scripts/check_kubernetes.sh
        env:
          FLOWSTATE_K8S_VALIDATION: synthetic-only
      - name: Synthetic lab cleanup
        if: always()
        run: kind delete cluster --name flowstate-ci
