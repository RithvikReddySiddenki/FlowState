# Optional local observability. Use with compose.yml and an environment override.
services:
  api:
    environment:
      ENABLE_METRICS: "true"
  operations-exporter:
    profiles: [monitoring]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://flowstate:${POSTGRES_PASSWORD}@db:5432/flowstate
      REDIS_URL: redis://redis:6379/0
    command: [python, -m, apps.api.metrics_exporter]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.15.1
    ports: ["127.0.0.1:19090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api, operations-exporter]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.4
    ports: ["127.0.0.1:13001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a unique local Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  prometheus_data:
  grafana_data:
