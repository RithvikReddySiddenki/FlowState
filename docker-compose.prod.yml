# Production-shaped, loopback-only configuration. TLS publication requires approval.
services:
  api:
    environment:
      APP_ENV: production
  worker:
    environment:
      APP_ENV: production
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
