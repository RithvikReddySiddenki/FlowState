apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, fsGroup: 1000}
      initContainers:
        - name: wait-migrations
          image: flowstate-api:local
          imagePullPolicy: IfNotPresent
          command: [python, -m, apps.api.wait_for_migrations]
          envFrom: [{configMapRef: {name: flowstate}}, {secretRef: {name: flowstate}}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
      containers:
        - name: api
          image: flowstate-api:local
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: flowstate}}, {secretRef: {name: flowstate}}]
          ports: [{containerPort: 8000}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 15}
      volumes: [{name: tmp, emptyDir: {}}]
