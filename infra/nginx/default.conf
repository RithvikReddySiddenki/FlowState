resolver 127.0.0.11 valid=10s ipv6=off;
upstream flowstate_api {
    zone flowstate_api 64k;
    server api:8000 resolve;
}
upstream flowstate_web {
    zone flowstate_web 64k;
    server web:3000 resolve;
}
server {
    # Default access logs include OAuth callback query strings. Application logs
    # use route templates and request IDs instead.
    access_log off;
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        # Strip /api/ before forwarding to the root FastAPI routes.
        proxy_pass http://flowstate_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
    location = /api { return 308 /api/; }
    location / {
        proxy_pass http://flowstate_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
